<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commonwealth Boulevard Traffic Calming | Kings Park West</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Public+Sans:wght@400;500&display=swap');

  :root {
    --forest: #2F4B3C;
    --terra: #BF5E3C;
    --cream: #FAF6EC;
    --slate: #5C6B66;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Public Sans', sans-serif;
    background: var(--forest);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--cream);
    color: var(--forest);
    border-radius: 12px;
    padding: 48px 40px;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  .label {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--terra);
    font-weight: 500;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Lora', serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 16px;
  }

  p {
    font-size: 15px;
    color: var(--slate);
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .contact {
    font-size: 14px;
    color: var(--forest);
  }

  .contact a {
    color: var(--terra);
    text-decoration: none;
    font-weight: 500;
  }

  .contact a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="label">Kings Park West Civic Association</div>
    <h1>Looking to learn more about our traffic calming efforts?</h1>
    <p>We're putting the finishing touches on this site — project updates, FAQs, and the full plan will be here soon.</p>
    <div class="contact"><a href="mailto:board@kpwca.org">Email us at board@kpwca.org</a></div>
  </div>
</body>
</html>
